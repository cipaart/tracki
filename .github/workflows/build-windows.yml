name: build-windows

# Sestavi portable Tracki.exe na Windows runneru a nahraje ho jako artefakt.
# Pri tagu v* se .exe navic prilozi k Release.
#
# Pozn.: spoustec `release: published` tu zamerne NENI. Publikovani Release
# pres web GitHubu tag vytvori, takze push udalost vznikne sama a build se
# spusti. Kdyby tu byly oba spoustece, bezely by dva stejne buildy naraz
# a kazdy by k Release nahraval svoji binarku - vyhral by ten, co dobehne
# pozdeji, a vysledek by byl nahodny.

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalace zavislosti
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Testy
        run: python -m pytest -q

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalace zavislosti
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Cache ffmpeg
        uses: actions/cache@v4
        with:
          path: build/ffmpeg
          key: ffmpeg-win64-lgpl-v1

      - name: Stazeni ffmpeg
        run: python build/fetch_ffmpeg.py

      - name: PyInstaller
        run: >
          python -m PyInstaller --noconfirm --clean
          --distpath dist --workpath build/pyinstaller
          build/tracki.spec

      - name: Oprava PE checksumu
        run: python build/fix_checksum.py dist/Tracki.exe

      - name: Kontrola vysledku
        shell: pwsh
        run: |
          $exe = "dist/Tracki.exe"
          if (-not (Test-Path $exe)) { throw "Tracki.exe nevznikl" }
          $size = (Get-Item $exe).Length / 1MB
          Write-Host ("Tracki.exe: {0:N1} MB" -f $size)
          if ($size -lt 15) { throw "exe je podezrele male - ffmpeg se asi neprilozil" }
          # Overi, ze se exe vubec spusti (--version nema, takze jen kratky start).
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 12
          if ($process.HasExited) {
            throw "Tracki.exe se ukoncil hned po startu (kod $($process.ExitCode))"
          }
          Stop-Process -Id $process.Id -Force
          Write-Host "Tracki.exe nabehl a drzi se v behu - OK"

      - name: SHA256
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/Tracki.exe -Algorithm SHA256).Hash
          Write-Host "SHA256: $hash"
          "$hash  Tracki.exe" | Out-File -Encoding ascii dist/Tracki.exe.sha256

      - name: Nahrani artefaktu
        uses: actions/upload-artifact@v4
        with:
          name: Tracki-windows-portable
          path: |
            dist/Tracki.exe
            dist/Tracki.exe.sha256
          if-no-files-found: error
          retention-days: 90

  release:
    needs: build
    # github.ref je refs/tags/v... u obou pripadu: push tagu i publikovaneho Release.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Tracki-windows-portable
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Tracki.exe
            dist/Tracki.exe.sha256
          # Zadny `body` zamerne: action by jim prepsala popis, ktery si
          # k Release napsal clovek. Takhle jen prilozi soubory.
